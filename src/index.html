<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>SimUI - Angular UI Components Built With Spartan UI</title>
		<meta
			name="description"
			content="SimUI is a free, open-source collection of copy-paste Angular UI components built with Spartan UI primitives and Tailwind CSS." />
		<meta
			name="keywords"
			content="SimUI, Spartan UI, Angular UI Components, Angular Component Collection, Tailwind CSS, Shadcn Angular, Copy Paste Components" />
		<meta name="author" content="SimUI" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<meta
			name="google-signin-client_id"
			content="1083856135766-b4ddv3g9389s7m154f4da9vt0iqe4bcp.apps.googleusercontent.com" />
		<script>
			if (localStorage.getItem('simui-appearance') === 'dark') {
				if (document && document.documentElement) {
					document.documentElement.classList.add('dark');
				}
			} else if (document && document.documentElement) {
				document.documentElement.classList.remove('dark');
				localStorage.setItem('simui-appearance', 'light');
			}
		</script>
	</head>
	<body class="bg-background text-foreground">
		<app-root></app-root>
	</body>
</html>
